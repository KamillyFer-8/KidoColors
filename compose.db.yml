# Banco local opcional para Java/Vite no host; o desenvolvimento com PostgreSQL hospedado não usa este arquivo.
# Use --env-file .env.docker. Para a aplicação completa use docker-compose.yml.
name: kidocolors-dev-db
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-kidocolors}
      POSTGRES_USER: ${DB_USERNAME:-kidocolors}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env.docker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
