server:
  port: ${SERVER_PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kidocolors}
    username: ${DB_USERNAME:kidocolors}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      fail-on-unknown-properties: true
kidocolors:
  scanner:
    timeout-ms: ${SCANNER_TIMEOUT_MS:30000}
    readiness-timeout-ms: ${SCANNER_READINESS_TIMEOUT_MS:5000}
    settle-ms: ${SCANNER_SETTLE_MS:500}
    storage-path: ${CAPTURE_STORAGE_PATH:storage/captures}
